<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>SNES Web Player</title>
  <style>
    html, body {
      margin: 0; height: 100%; background: #111; overflow: hidden;
      overscroll-behavior: none; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    #game { position: fixed; inset: 0; width: 100vw; height: 100dvh; }
    .overlay {
      display: none; position: fixed; inset: 0; background: #111; color: #eee;
      font: 600 18px/1.4 system-ui, sans-serif; text-align: center;
      align-items: center; justify-content: center; flex-direction: column; gap: 16px; padding: 24px;
    }
    #picker { z-index: 99998; touch-action: auto; }
    #picker p { margin: 0; font-weight: 400; font-size: 14px; color: #aaa; max-width: 32em; }
    #picker label {
      background: #2e7d32; color: #fff; padding: 14px 28px; border-radius: 10px; cursor: pointer;
    }
    #picker input { display: none; }
    #rotate { z-index: 99999; }
    @media (pointer: coarse) and (orientation: portrait) {
      #rotate { display: flex; }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="picker" class="overlay">
    <label>Choose your SNES ROM<input id="file" type="file" accept=".sfc,.smc"></label>
    <p>The file stays on this device: it is stored in your browser and never uploaded.</p>
  </div>
  <div id="rotate" class="overlay">Rotate your phone to landscape</div>
  <script>
    // SNES emulator (snes9x core compiled to WASM) provided by EmulatorJS.
    // No game is bundled: the ROM comes from a local rom.sfc next to this page
    // (local dev server) or from a file the player picks, kept in IndexedDB.

    const DB = "snes-web", STORE = "rom", KEY = "current";

    function db() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(STORE);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function loadSaved() {
      try {
        const d = await db();
        return await new Promise((resolve) => {
          const req = d.transaction(STORE).objectStore(STORE).get(KEY);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch { return null; }
    }
    async function save(blob) {
      try {
        const d = await db();
        d.transaction(STORE, "readwrite").objectStore(STORE).put(blob, KEY);
      } catch { /* storage unavailable: the ROM just won't be remembered */ }
    }
    async function localRom() {
      try {
        const res = await fetch("rom.sfc", { method: "HEAD" });
        return res.ok;
      } catch { return false; }
    }

    function start(gameUrl) {
      document.getElementById("picker").style.display = "none";
      window.EJS_player = "#game";
      window.EJS_core = "snes9x";
      window.EJS_gameName = "game";
      window.EJS_gameUrl = gameUrl;
      window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
      window.EJS_startOnLoaded = true;
      window.EJS_color = "#2e7d32";

      // Touch controls: joystick under the left thumb, action buttons under the right.
      window.EJS_VirtualGamepadSettings = [
        { type: "zone", location: "left", left: "50%", top: "50%",
          joystickInput: false, inputValues: [4, 5, 6, 7], color: "white" },
        { type: "button", text: "X", id: "x", location: "right", left: 40,           bold: true, input_value: 9 },
        { type: "button", text: "Y", id: "y", location: "right",           top: 40,  bold: true, input_value: 1 },
        { type: "button", text: "A", id: "a", location: "right", left: 81, top: 40,  bold: true, input_value: 8 },
        { type: "button", text: "B", id: "b", location: "right", left: 40, top: 80,  bold: true, input_value: 0 },
        { type: "button", text: "L", id: "l", location: "left",  left: 3,  top: -90, bold: true, block: true, input_value: 10 },
        { type: "button", text: "R", id: "r", location: "right", right: 3, top: -90, bold: true, block: true, input_value: 11 },
        { type: "button", text: "Start",  id: "start",  location: "center", left: 60, fontSize: 15, block: true, input_value: 3 },
        { type: "button", text: "Select", id: "select", location: "center", left: -5, fontSize: 15, block: true, input_value: 2 }
      ];

      const s = document.createElement("script");
      s.src = window.EJS_pathtodata + "loader.js";
      document.body.appendChild(s);
    }

    (async () => {
      if (await localRom()) return start("rom.sfc");
      const saved = await loadSaved();
      if (saved) return start(URL.createObjectURL(saved));
      document.getElementById("picker").style.display = "flex";
      document.getElementById("file").addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        await save(file);
        start(URL.createObjectURL(file));
      });
    })();
  </script>
</body>
</html>
